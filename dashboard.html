<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wildrose Dashboard</title>
<meta name="description" content="Log in to your Wildrose dashboard.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
<style>
:root{--orange:#ff5722;--orange2:#ff8a3d;--ink:#17120f;--muted:#725241;--line:#f2d6c4;--shadow:0 30px 80px rgba(133,54,14,.16)}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(circle at 18% 10%,rgba(255,87,34,.28),transparent 32%),radial-gradient(circle at 90% 82%,rgba(255,138,61,.20),transparent 30%),linear-gradient(135deg,#fff7ed,#fffdf9 55%,#ffe7d3)}body:before{content:"";position:fixed;inset:0;background-image:radial-gradient(rgba(255,87,34,.10) 1px,transparent 1px);background-size:24px 24px;mask-image:linear-gradient(#000,transparent 78%);pointer-events:none}.top{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:24px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:950;letter-spacing:-.04em}.mark{width:34px;height:34px;border-radius:12px;background:linear-gradient(135deg,var(--orange),var(--orange2));box-shadow:0 12px 28px rgba(255,87,34,.32)}.top a:not(.brand){color:var(--muted);font-weight:850;text-decoration:none}.shell{position:relative;z-index:1;min-height:calc(100vh - 84px);display:grid;place-items:center;padding:20px}.card{width:min(100%,460px);background:rgba(255,253,249,.94);border:1px solid rgba(242,214,196,.95);box-shadow:var(--shadow);border-radius:34px;padding:34px}.eyebrow{display:inline-flex;width:max-content;border:1px solid #ffd0b8;background:#fff4ec;color:#b64217;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:950;letter-spacing:.12em;text-transform:uppercase}h1,h2{letter-spacing:-.065em;line-height:.96;margin:18px 0 10px}h1{font-size:clamp(42px,8vw,62px)}h2{font-size:36px}.script{font-family:"Playfair Display",serif;font-style:italic;color:var(--orange);letter-spacing:-.04em}.copy{color:var(--muted);font-size:16px;line-height:1.5;margin:0 0 24px}.form{display:grid;gap:14px}.field{display:grid;gap:8px;font-weight:900}.field span{font-size:13px;color:var(--muted);font-weight:750}.input{width:100%;border:1px solid #ead1bf;background:#fffaf6;border-radius:16px;padding:15px 16px;font:inherit;font-weight:750;color:var(--ink);outline:none}.input:focus{border-color:var(--orange);box-shadow:0 0 0 4px rgba(255,87,34,.13)}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:16px;border:1px solid transparent;padding:13px 16px;font:inherit;font-weight:950;cursor:pointer;text-decoration:none;transition:.16s transform,.16s opacity}.btn:hover{transform:translateY(-1px)}.btn:disabled{opacity:.62;cursor:not-allowed}.primary{background:linear-gradient(135deg,var(--orange),var(--orange2));color:#fff;box-shadow:0 16px 34px rgba(255,87,34,.28)}.secondary{background:#fff6ef;color:#b64217;border-color:#ffd0b8}.status{min-height:20px;color:#b42318;font-size:14px;font-weight:850}.small{font-size:13px;color:var(--muted);margin-top:14px}.dashboard{display:none;width:min(100%,620px)}.dash-card{background:rgba(255,253,249,.94);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:34px;padding:30px}.dash-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:22px}.pill{display:inline-flex;border-radius:999px;background:#fff1e8;color:#b64217;padding:8px 12px;font-size:12px;font-weight:950;text-transform:uppercase;letter-spacing:.08em}.site{font-size:15px;color:var(--muted);font-weight:800}.progress{display:grid;gap:10px;margin:22px 0}.step{display:flex;gap:12px;align-items:center;border:1px solid #f1ddcf;background:#fffaf6;border-radius:18px;padding:13px}.dot{width:19px;height:19px;border-radius:50%;border:2px solid #e7c4ae;flex:0 0 auto}.step.done .dot{background:var(--orange);border-color:var(--orange);box-shadow:inset 0 0 0 4px #fff}.step b{display:block;font-size:15px}.step span{display:block;font-size:13px;color:var(--muted);font-weight:750;margin-top:2px}.summary{border:1px solid #f1ddcf;background:#fff7ef;border-radius:22px;padding:18px;margin-top:18px}.summary-row{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px solid #efd7c8}.summary-row:last-child{border-bottom:0}.summary-row span{color:var(--muted);font-weight:750}.summary-row b{text-align:right}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.logout{background:transparent;border:0;color:var(--muted);font-weight:900;cursor:pointer}.hidden{display:none!important}@media(max-width:640px){.top{padding:18px}.shell{padding:14px;place-items:start center}.card,.dash-card{border-radius:28px;padding:24px}.dash-head{display:block}.actions{grid-template-columns:1fr}h1{font-size:46px}}
</style>
</head>
<body>
<header class="top"><a class="brand" href="/"><span class="mark"></span><span>Wildrose</span></a><a href="/">Back to site</a></header>
<main class="shell">
  <section class="card" id="loginCard">
    <span class="eyebrow">Wildrose Dashboard</span>
    <h1>Log in to <span class="script">Rose.</span></h1>
    <p class="copy">Use the email and password you created after checkout.</p>
    <form class="form" id="loginForm">
      <label class="field">Email <span>Your Wildrose login email</span><input class="input" id="email" type="email" autocomplete="email" required></label>
      <label class="field">Password <span>Your account password</span><input class="input" id="password" type="password" autocomplete="current-password" required></label>
      <button class="btn primary" id="loginBtn" type="submit">Log in</button>
      <div class="status" id="status"></div>
    </form>
    <p class="small">Need help? Email invites@wildroseautomations.ca.</p>
  </section>
  <section class="dashboard" id="dashboard">
    <div class="dash-card">
      <div class="dash-head">
        <div><span class="pill" id="statusPill">Setup started</span><h2 id="dashTitle">Your Rose setup</h2><div class="site" id="siteLine"></div></div>
        <button class="logout" id="logoutBtn" type="button">Log out</button>
      </div>
      <div class="progress" id="progress"></div>
      <div class="summary" id="summary"></div>
      <div class="actions"><a class="btn primary" id="setupLink" href="/thank-you.html">See setup info</a><button class="btn secondary" id="problemBtn" type="button">I’m having problems</button></div>
    </div>
  </section>
</main>
<script>
const API='https://wildrose-widget.wildeautomations.com';
const INSTALL_EMAIL='invites@wildroseautomations.ca';
const tokenKey='wildroseDashboardToken';
const $=id=>document.getElementById(id);
function fmtDate(v){try{return v?new Date(v).toLocaleDateString():''}catch{return ''}}
function setStatus(msg){$('status').textContent=msg||''}
async function post(path,payload,token){const r=await fetch(API+path,{method:'POST',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:JSON.stringify(payload||{})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Request failed');return j}
function keepStages(stages=[]){const wanted=['paid','access_sent','installed','qa','live']; const labels={paid:'Checkout complete',access_sent:'Access sent',installed:'Rose installed',qa:'Wildrose testing',live:'Rose live'}; return wanted.map(key=>{const found=stages.find(s=>s.key===key)||{}; return {key,label:labels[key],done:!!found.done,at:found.at||''}})}
function renderDashboard(data,token){if(token)localStorage.setItem(tokenKey,token);$('loginCard').classList.add('hidden');$('dashboard').style.display='block';const c=data.customer||{}, a=data.account||{}, inst=data.install||{};$('dashTitle').textContent=c.businessName||'Your business';$('siteLine').textContent=[c.website,c.provider].filter(Boolean).join(' · ');const installed=Boolean(inst.connected)||['connected','installed','live'].some(x=>String(inst.status||'').toLowerCase().includes(x))||(inst.stages||[]).some(s=>['connected','live'].includes(s.key)&&s.done);$('statusPill').textContent=(installed?'Rose live':(inst.status||'setup started')).replace(/_/g,' ');const setupUrl='/thank-you.html?id='+encodeURIComponent(c.checkoutLeadId||'')+'&businessName='+encodeURIComponent(c.businessName||'')+'&website='+encodeURIComponent(c.website||'')+'&email='+encodeURIComponent(a.email||'')+'&sitePlatform='+encodeURIComponent(c.provider||'');$('setupLink').href=installed?'https://jack108510.github.io/rose-dashboard-preview/?v=0f9a2ec':setupUrl;$('progress').innerHTML=keepStages(inst.stages||[]).map(s=>`<div class="step ${s.done?'done':''}"><span class="dot"></span><div><b>${s.label}</b><span>${s.done?(s.at?fmtDate(s.at):'Done'):'Waiting'}</span></div></div>`).join('');$('summary').innerHTML=[['Plan',c.plan],['Login',a.email],['Setup ID',c.checkoutLeadId?(c.checkoutLeadId.slice(0,18)+'…'):'']].map(([k,v])=>`<div class="summary-row"><span>${k}</span><b>${v||'—'}</b></div>`).join('')}
async function loadSaved(){const token=localStorage.getItem(tokenKey);if(!token)return;try{renderDashboard(await post('/api/rose-account-dashboard',{token},token),token)}catch(e){localStorage.removeItem(tokenKey)}}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();setStatus('');const btn=$('loginBtn');btn.disabled=true;const old=btn.textContent;btn.textContent='Logging in…';try{const data=await post('/api/rose-account-login',{email:$('email').value.trim(),password:$('password').value});renderDashboard(data,data.token)}catch(err){setStatus(err.message||'Could not log in.');btn.disabled=false;btn.textContent=old}});
$('logoutBtn').addEventListener('click',()=>{localStorage.removeItem(tokenKey);location.reload()});
$('problemBtn').addEventListener('click',()=>{const subject=encodeURIComponent('I need help with my Rose setup');const body=encodeURIComponent('Hi Wildrose,\n\nI need help with my Rose setup. Please reach back out to me.\n\nDashboard page: '+location.href+'\n');location.href='mailto:'+INSTALL_EMAIL+'?subject='+subject+'&body='+body});
loadSaved();
</script>
</body>
</html>

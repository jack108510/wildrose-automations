<!doctype html><html><head><meta charset="utf-8"><title>Reachr Approval Queue</title><style>body{width:350px;margin:0;padding:20px;background:#0b0d13;color:#f6f7fb;font:14px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}h1{font-size:18px;margin:0 0 7px}p{color:#9da7ba;font-size:12px;line-height:1.5;margin:0 0 14px}.metric{background:#151923;border:1px solid #272d3b;border-radius:10px;padding:10px 12px;margin-bottom:12px;color:#d9dfeb}.buttons{display:grid;gap:8px}button{width:100%;border:0;border-radius:9px;padding:12px;background:#d17a48;color:#fff;font-weight:700;cursor:pointer}button.secondary{background:#252b39}.status{min-height:20px;margin-top:12px;color:#abb4c5;font-size:12px;line-height:1.5}.error{color:#ff9f9f}</style></head><body><h1>Reachr approval queue</h1><p>Prospects are reviewed from group feeds. Messenger replies are scanned only from your open inbox and never send without an explicit approval click.</p><div id="count" class="metric">Loading…</div><div class="buttons"><button id="inbox">Sync open Messenger inbox</button><button id="scan" class="secondary">Scan open group tabs</button><button id="review" class="secondary">Open approval board</button></div><div id="status" class="status"></div><script src="queue.js"></script><script src="messenger-utils.js"></script><script src="popup.js"></script></body></html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Reachr Approval Board</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#090b10;color:#f5f7fb;font:15px/1.45 Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}header{position:sticky;top:0;z-index:3;background:rgba(9,11,16,.94);backdrop-filter:blur(12px);border-bottom:1px solid #242936;padding:18px max(5vw,16px);display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:20px;line-height:1.2;margin:0}.summary{color:#9ca7ba;text-align:right}.wrap{max-width:1100px;margin:0 auto;padding:24px max(5vw,16px) calc(28px + env(safe-area-inset-bottom))}.section{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#9ca7ba;margin:28px 0 12px}.empty{padding:40px 20px;text-align:center;color:#98a3b6;border:1px dashed #303746;border-radius:16px}.card{background:#11151e;border:1px solid #252c39;border-radius:16px;padding:18px;margin-bottom:14px}.top{display:flex;justify-content:space-between;gap:16px}.name{font-size:17px;font-weight:750;overflow-wrap:anywhere}.group{color:#9da8bb;margin-top:5px;overflow-wrap:anywhere}.excerpt{white-space:pre-wrap;overflow-wrap:anywhere;color:#c5ccda;line-height:1.55;margin:14px 0;padding:12px;background:#0b0e14;border-radius:10px}.draft{display:block;width:100%;min-height:125px;background:#0b0e14;border:1px solid #303746;border-radius:10px;color:#f4f6fa;padding:12px;font:inherit;line-height:1.5;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button,a.button{min-height:44px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:9px;padding:10px 13px;background:#d17a48;color:white;font:700 14px Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;text-decoration:none;cursor:pointer}.secondary{background:#252c39!important}.reject{background:#522a31!important}.approved,.sent{border-color:#315f47}.closed{opacity:.58}.badge{flex:0 0 auto;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#9da8bb;text-align:right}@media(max-width:640px){body{font-size:16px}header{align-items:flex-start;flex-direction:column;padding-top:max(16px,env(safe-area-inset-top))}.summary{text-align:left;font-size:13px}.wrap{padding-top:18px}.section{margin-top:24px}.card{padding:14px;border-radius:14px}.top{gap:10px}.name{font-size:17px}.badge{max-width:42%;font-size:10px}.excerpt{font-size:14px;padding:11px}.draft{min-height:140px;font-size:16px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.actions button,.actions a.button{width:100%}.actions button[data-msg-approve]{grid-column:1/-1;min-height:50px;font-size:15px}}@media(max-width:360px){.actions{grid-template-columns:1fr}.actions button[data-msg-approve]{grid-column:auto}}</style></head><body><header><h1>Reachr approval board</h1><div id="summary" class="summary"></div></header><main class="wrap"><div class="section">Messenger replies — explicit approval required</div><div id="messages"></div><div class="section">Prospect drafts</div><div id="prospects"></div></main><script src="messenger-utils.js"></script><script src="review.js"></script></body></html>

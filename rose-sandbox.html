<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rose Sandbox — Wildrose</title>
  <style>
    body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#fffaf4;color:#141414;min-height:100vh;display:grid;place-items:center;padding:40px}
    main{max-width:720px;background:white;border:1px solid #eee;border-radius:28px;padding:36px;box-shadow:0 24px 80px rgba(20,20,20,.08)}
    h1{font-size:clamp(36px,7vw,72px);letter-spacing:-.06em;line-height:.95;margin:0 0 16px}
    p{font-size:18px;line-height:1.6;color:#666}code{background:#fff1ea;color:#ff5722;border-radius:8px;padding:2px 6px}
  </style>
<!-- Wildrose analytics: Microsoft Clarity -->
<script type="text/javascript">
(function(c,l,a,r,i,t,y){
  c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
  t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
  y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
})(window,document,"clarity","script","y3isf2gtkw");
window.wrTrack=function(name){try{if(window.clarity&&name)window.clarity("event",name)}catch(e){}};
document.addEventListener("click",function(e){
  var el=e.target.closest&&e.target.closest("button,a"); if(!el) return;
  var txt=(el.dataset.analytics||el.dataset.plan||el.textContent||"").trim().toLowerCase();
  var eventName="";
  if(txt.includes("buy your agent")||txt.includes("continue to checkout")) eventName="rose_buy_clicked";
  else if(txt.includes("build")&&txt.includes("preview")) eventName="rose_mockup_started";
  else if(txt.includes("send setup")||txt.includes("save setup")) eventName="rose_setup_submit_clicked";
  else if(txt.includes("book")||txt.includes("call")) eventName="rose_setup_call_clicked";
  if(eventName) window.wrTrack(eventName);
},true);
document.addEventListener("submit",function(e){
  var id=e.target&&e.target.id;
  if(id==="checkoutForm"||id==="roseLeadForm") window.wrTrack("rose_checkout_lead_submit");
  if(id==="onboardingForm") window.wrTrack("rose_onboarding_submit");
  if(id==="mockForm"||id==="heroForm") window.wrTrack("rose_mockup_submit");
},true);
</script>
</head>
<body>
  <main>
    <h1>Rose sandbox.</h1>
    <p>This page loads <code>wildrose-widget-sandbox.js</code> only. Tweak Rose here safely without touching the production widget file.</p>
    <p>Open the Rose bubble in the bottom-right corner to test chat/voice UI changes.</p>
  </main>
  <script src="wildrose-widget-sandbox.js?v=no-duplicates-1" data-api-base="https://wildrose-widget.wildeautomations.com" data-title="Rose" data-accent="#ff5722"></script>
</body>
</html>
